// REARMED first start: desktop resolution, the graphics preset and the new controls
seta r_mode "-2"
seta r_fullscreen "2"			// borderless fullscreen (F10 > VIDEO > Display mode)
seta cg_horPlus "1"
seta cg_fov "90"
exec rearmed_gfx.cfg
bind MOUSE2 "+button12"		// alt-fire
bind e "+button13"			// offhand grapple
bind q "+button14"			// dash
bind SHIFT "+button14"		// dash
bind f "weapon 11"			// nailgun
bind g "weapon 12"			// prox launcher
bind v "weapon 13"			// chaingun
bind z "+button15"			// zip line
bind F10 "rearmed"			// REARMED settings
bind r "+wheel"				// weapon wheel: hold + mouse to pick, tap for last weapon
vid_restart
