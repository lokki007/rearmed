// REARMED dedicated server config (goes in home\rearmed\server.cfg)
seta sv_hostname "REARMED server"
seta sv_maxclients 12
seta g_gametype 0				// 0 FFA, 1 duel, 3 team DM, 4 CTF
seta fraglimit 30
seta timelimit 15
seta sv_pure 1
// only the REARMED pk3 may be downloaded; the Team Arena pack is built by each player's setup
seta sv_allowDownload 0

// REARMED rules
seta g_rearmMode 0				// 0 normal, 1 gun game, 2 juggernaut, 3 instagib, 4 one in the chamber
seta g_mutators 1
seta g_mutatorInterval 90
seta g_mutatorDuration 40
seta g_rearmItems 1				// Team Arena weapons on stock maps: 0 off, 1 some, 2 all
seta g_rearmPowerups 1
seta g_killstreaks 1
seta g_bounty 1
seta g_medals 1
seta g_offhandHook 1

// bots fill the server up to this many players
seta bot_minplayers 4
seta bot_rearm 1
seta g_spSkill 3

set d1 "map q3dm6 ; set nextmap vstr d2"
set d2 "map q3dm17 ; set nextmap vstr d3"
set d3 "map q3dm7 ; set nextmap vstr d4"
set d4 "map q3dm13 ; set nextmap vstr d1"
vstr d1
