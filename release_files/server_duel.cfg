// REARMED 1v1 duel config (goes in home\rearmed\server_duel.cfg). Used by "Host 1v1.bat".
seta sv_hostname "REARMED 1v1"
seta sv_maxclients 2
seta g_gametype 1				// tournament: one on one
seta fraglimit 20
seta timelimit 15
seta g_warmup 10
seta g_doWarmup 1
seta sv_pure 1
seta sv_allowDownload 0
seta bot_minplayers 0			// no bots: just the two of you

// REARMED rules (change them here, or with /rcon on the server)
seta g_rearmMode 0				// 0 normal, 1 gun game, 2 juggernaut, 3 instagib, 4 one in the chamber
seta g_mutators 0				// random events off for a fair duel (1 = on)
seta g_rearmItems 1
seta g_rearmPowerups 1
seta g_killstreaks 1
seta g_medals 1
seta g_offhandHook 1

// duel maps: stock id maps every Quake III install has
set d1 "map q3tourney2 ; set nextmap vstr d2"
set d2 "map q3dm13 ; set nextmap vstr d3"
set d3 "map q3tourney4 ; set nextmap vstr d4"
set d4 "map q3dm6 ; set nextmap vstr d5"
set d5 "map q3dm17 ; set nextmap vstr d1"
vstr d1
