// DOUBLE AGENT (the next enemy hit turns for 8 s), DEADEYE (every 5th hit a headshot)
exec cards_start.cfg
god
dslegend 8
dslegend 11
wait 20
dslgtest hit 2 3
wait 10
dslgtest hit 2 3
dslgtest hurt 2 10
wait 10
dslgtest hit 1 3
dslgtest hit 1 3
dslgtest hit 1 3
dslgtest hit 1 3
dslgtest hit 1 3
wait 10
dslgtest agentkill
wait 30
set cg_thirdPerson 1
screenshotJPEG
set cg_thirdPerson 0
wait 1100
dslgstate
quit
