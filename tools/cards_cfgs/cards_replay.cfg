// cards_reveal with the best-kill replay on (16:9: tally -> replay -> cards)
// the rocket launcher at level 8 = EVOLVES), screenshots every ~0.25 s
exec cards_common.cfg
set cg_replays 1
wait 60
descent new 3
wait 20
rlpicknode 0
wait 500
god
bot_pause 1
dslevel 5 8
dsused 5
wait 20
dsfrag
wait 30
dsfrag
wait 30
rlwin 55 90 33
set s "screenshotJPEG; wait 25"
vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s
vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s
vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s
vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s
weapon 1
vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s; vstr s
rlstate
quit
