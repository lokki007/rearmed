// hero: quad rail headshot (decapitation) on Sarge, the kill cam replays it in the side panel
// while the player turns and rails Doom, then strafes off. wait = ~4 ms here (fixedtime 8, 2 waits a frame)
wait 100
exec clip_common.cfg
set cg_killCam 1
set cg_killCamSide 0
set cg_replays 1
set g_rearmMode 0
set fraglimit 0
set bot_pause 1
addbot sarge 1
addbot doom 1
wait 300
god
give all
give quad damage
wait 30
weapon 7
teleport 0 1350 -60 -39 180 0
teleport 1 1110 -60 -39 0
teleport 2 1068 43 -39 340
set cl_yawspeed 120
wait 300
record hero
wait 450
+attack
wait 3
-attack
wait 70
+right
wait 42
-right
wait 300
+attack
wait 3
-attack
wait 40
+moveleft
wait 120
+moveup
wait 60
-moveup
wait 100
-moveleft
+moveright
wait 200
-moveright
wait 500
stoprecord
wait 10
quit
