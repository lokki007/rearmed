// en-daily: jump today's attempt to the floor 6 boss with g_dsBossMode 1 set (the daily must still be the timed 1v1),
// kill it, the result screen (boss clock bonus), then the daily screen
set com_maxfps 60
set ui_rlDevmap 1
set g_rearmMode 0
set g_fragMult 1
set bot_pause 0
set g_dsBossMode 1
set g_dsBossTime 120
set ds_dailyDate 20261013
wait 60
dsdaily start
wait 60
screenshotJPEG
wait 10
dsboss 1
wait 900
dskillboss
wait 1200
screenshotJPEG
wait 3000
dsdailyscore
screenshotJPEG
wait 10
dsdailypb
quit
