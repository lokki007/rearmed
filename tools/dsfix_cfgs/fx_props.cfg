// bug 3: shoot each prop type, it must explode / break / fly (never vanish)
// (g_propTest is read every 200 ms: 30 frames between sets)
exec dsfix_common.cfg
set g_propCount 0
wait 200
god
notarget
bot_pause 1
teleport 0 -208 448 24 0
wait 30
set g_propTest "tank -40 420 40"
wait 30
set g_propTest "barrel -60 470 40"
wait 30
set g_propTest "crate 40 470 40"
wait 150
set g_propTest "list"
wait 30
screenshotJPEG
set g_propTest "hit tank 7"
wait 30
screenshotJPEG
wait 12
screenshotJPEG
wait 30
set g_propTest "list"
wait 120
set g_propTest "list"
wait 30
set g_propTest "hit barrel 20"
wait 30
screenshotJPEG
wait 150
set g_propTest "list"
wait 30
set g_propTest "hit crate 30"
wait 30
screenshotJPEG
wait 30
set g_propTest "list"
wait 30
quit
