// one floor per difficulty: 120 gem xp vacuumed to the machinegun, then a win (DSEcon floor line)
set com_maxfps 60
set ui_rlDevmap 1
set g_rearmMode 0
set g_fragMult 1
set g_dsBossSim 0
wait 60
exec econ_one.cfg
descent new 1
rlpicknode 0
wait 420
vstr econ_floor
descent new 2
rlpicknode 0
wait 420
vstr econ_floor
descent new 3
rlpicknode 0
wait 420
vstr econ_floor
descent new 4
rlpicknode 0
wait 420
vstr econ_floor
descent new 5
rlpicknode 0
wait 420
vstr econ_floor
wait 60
quit
