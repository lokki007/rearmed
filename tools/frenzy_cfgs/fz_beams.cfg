// loot beams on chests / spike pickups across q3dm17 (a vault floor: no bots), FPS with many beams
exec fz_common.cfg
set com_maxfps 250
wait 60
descent new 3
wait 20
dsvault q3dm17
wait 600
god
notarget
dsbeam chests
dsbeam 0
wait 100
dsfzstate
screenshotJPEG
setviewpos -288 -376 420 45
wait 60
screenshotJPEG
setviewpos -288 -376 420 135
wait 60
screenshotJPEG
setviewpos 600 900 300 225
wait 60
screenshotJPEG
// many beams: 24 at once, FPS on screen
dsbeam 3
dsbeam 2
dsbeam 1
dsbeam 3
dsbeam 2
dsbeam 1
dsbeam 3
dsbeam 2
dsbeam 1
dsbeam 3
dsbeam 2
dsbeam 1
wait 200
dsfzstate
screenshotJPEG
set g_dsBeams 0
wait 200
dsfzstate
screenshotJPEG
set g_dsBeams 1
quit
