// en-feel stats: 6 bots fight on q3dm6 for ~5 minutes of game time (timescale 2), the player is god + notarget
// then the HitFeel counters (games.log "HitFeel:" lines, hftest stats)
wait 100
exec hf_set.cfg
set bot_pause 0
set fraglimit 0
set timelimit 0
addbot sarge 4
addbot visor 4
addbot doom 4
addbot anarki 4
addbot major 4
addbot ranger 4
wait 600
god
notarget
teleport 0 -24 -232 24 90
set timescale 2
wait 6000
hftest stats
wait 6000
hftest stats
wait 6000
hftest stats
wait 6000
hftest stats
wait 6000
hftest stats
set timescale 1
set bot_pause 1
wait 100
hftest stats
quit
