// en-feel visual checks: paused bots in front of the player, states forced with hftest
// client 1 doom (separate arm surfaces): armour, helmet, panic, arm, crawl, legs. client 2 sarge: decap.
wait 100
exec hf_set.cfg
set bot_pause 1
addbot doom 3
addbot sarge 3
wait 400
god
notarget
set cg_drawGun 0
teleport 0 -235 448 24 0 6
teleport 1 -125 428 24 180
teleport 2 -125 472 24 180
wait 200
screenshotJPEG
echo HF_SHOT0_plain
hftest 1 armor 40
wait 300
screenshotJPEG
echo HF_SHOT1_cracks_20pct
hftest 1 helmet
wait 30
screenshotJPEG
echo HF_SHOT2_helmet_pop
hftest 1 panic
wait 15
screenshotJPEG
echo HF_SHOT3_panic_drop
hftest 1 larm
wait 40
screenshotJPEG
echo HF_SHOT4_limb_flying
wait 250
screenshotJPEG
echo HF_SHOT5_noarm
hftest 1 crawl
wait 250
screenshotJPEG
echo HF_SHOT6_crawl
hftest 1 legs
wait 250
screenshotJPEG
echo HF_SHOT7_legless
hftest 2 stagger
wait 12
screenshotJPEG
echo HF_SHOT8_stagger
wait 150
hftest 2 decap
wait 50
screenshotJPEG
echo HF_SHOT9_decap
wait 120
screenshotJPEG
echo HF_SHOT10_killcam
wait 300
screenshotJPEG
echo HF_SHOT11_corpse
hftest stats
quit
